<!doctype html>
<!-- Designer's starter frame for code-rendered vertical shorts (2026-11-16). NOT a video and carries no facts: all text is placeholder.
     Video agent: copy into videos/<date>-<slug>/source/ and change freely; vary the layout per video (see board/2026-11-16-video-channel.md, Designer view).
     Render at viewport 1080x1920, deviceScaleFactor 1. Fonts: Inter and JetBrains Mono as installed in the container (no web fonts, nothing downloaded).
     Add ?guides=1 to see the safe area. Set data-theme on <html> to "ink", "paper" or "teal". -->
<html lang="en" data-theme="ink"><head><meta charset="utf-8"><meta name="viewport" content="width=1080">
<title>Frame template (placeholder)</title>
<style>
:root{--bg:#101a2e;--fg:#f5f3ec;--dim:#b9c2d3;--a:#ffb84d;--b:#5fd0c5;--track:#26334f}
[data-theme=paper]{--bg:#f5f1e6;--fg:#141b2b;--dim:#4a5468;--a:#a8480a;--b:#0d6b63;--track:#d9d2bf}
[data-theme=teal]{--bg:#0c3b3a;--fg:#f4f7f2;--dim:#b6d2cd;--a:#ffd166;--b:#ff9e8a;--track:#1b5553}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);color:var(--fg);font-family:Inter,"Liberation Sans",sans-serif;font-feature-settings:"tnum"}
/* Safe area: keep all text inside. Top 220, bottom 420, left 72, right 168 are the Designer's cautious margins for the apps' own buttons and captions, not platform-published figures. */
.safe{position:absolute;left:72px;right:168px;top:220px;bottom:420px;display:flex;flex-direction:column;gap:48px}
.kicker{font:700 40px/1.1 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--a)}
.q{font:800 104px/1.06 "Inter Display",Inter,sans-serif;letter-spacing:-.01em;text-wrap:balance}  /* headline: 6 words a line at most, 4 lines at most */
.cap{font:600 60px/1.2 Inter,sans-serif;color:var(--fg)}                                           /* caption: 2 lines at most on screen at once */
.num{font:800 150px/1 "Inter Display",Inter,sans-serif;color:var(--a)}
.rows{display:grid;gap:26px;margin-top:auto}
.row{display:grid;gap:12px}.row .lab{display:flex;justify-content:space-between;font:600 52px/1.1 Inter,sans-serif}
.row .val{font-family:"JetBrains Mono",monospace;font-weight:700}
.bar{height:48px;border-radius:10px;background:var(--track);overflow:hidden}.bar i{display:block;height:100%;width:var(--w);background:var(--b);border-radius:10px;transform-origin:left;animation:grow 1.2s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}
.row.hit .bar i{background:var(--a)}.row.hit .lab{color:var(--a)}
.src{font:500 40px/1.2 Inter,sans-serif;color:var(--dim)} /* smallest text allowed: 40px */
.timer{position:absolute;left:72px;right:168px;top:180px;height:14px;border-radius:7px;background:var(--track)}.timer i{display:block;height:100%;border-radius:7px;background:var(--a);animation:drain 5s linear both}
@keyframes grow{from{transform:scaleX(0)}}@keyframes drain{to{width:0}}
.guides .safe{outline:4px dashed #f0f}
</style></head><body>
<div class="timer"><i></i></div>
<div class="safe">
  <p class="kicker">Guess first</p>
  <h1 class="q">Placeholder question in five or six words a line?</h1>
  <p class="cap">One caption, two lines at most, no full stop needed</p>
  <div class="rows">
    <div class="row"><div class="lab"><span>Option A</span><span class="val">00</span></div><div class="bar"><i style="--w:38%"></i></div></div>
    <div class="row hit"><div class="lab"><span>Option B</span><span class="val">00</span></div><div class="bar"><i style="--w:92%;--d:.15s"></i></div></div>
    <div class="row"><div class="lab"><span>Option C</span><span class="val">00</span></div><div class="bar"><i style="--w:61%;--d:.3s"></i></div></div>
  </div>
  <p class="src">Source: [agency, dataset, year]</p>
</div>
<script>
const q=new URLSearchParams(location.search);if(q.get('guides'))document.body.classList.add('guides');if(q.get('theme'))document.documentElement.dataset.theme=q.get('theme');
</script>
</body></html>
